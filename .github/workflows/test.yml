name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Check the contrib extractor
        run: python3 -m py_compile scripts/extract-contrib.py
