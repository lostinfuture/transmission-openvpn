name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "sbom/**"
      - "go.mod"
      - ".github/workflows/build-docker.yml"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  schedule:
    # Rebuild every Monday 04:00 UTC from the pinned Dockerfile.
    # Transmission, OpenVPN, Rustnet, and the UI pins do not float.
    # This run publishes edge so Alpine package updates can ship. It does not move latest.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

env:
  DOCKERHUB_REPO: lostinfuture/transmission-openvpn
  GHCR_REPO: ghcr.io/lostinfuture/transmission-openvpn
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  buildx:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME#v}"
            CHANNEL=release
            MAJOR_MINOR="${VERSION%.*}"
            MAJOR="${VERSION%%.*}"
          else
            VERSION=edge
            CHANNEL=edge
            MAJOR_MINOR=""
            MAJOR=""
          fi
          echo "Resolved ${CHANNEL} version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"
          echo "MAJOR_MINOR=${MAJOR_MINOR}" >> "$GITHUB_ENV"
          echo "MAJOR=${MAJOR}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${DOCKER_PASSWORD}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "username=${DOCKER_USERNAME:-lostinfuture}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "username=lostinfuture" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_PASSWORD secret is not set; publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare image tags
        id: tags
        run: |
          set -euo pipefail
          DOCKER_USER="${{ steps.dockerhub.outputs.username }}"
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/transmission-openvpn"
          DH_IMAGE="${DOCKER_USER}/transmission-openvpn"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"

          if [ "${CHANNEL}" = "release" ]; then
            TAGS=(
              "${GHCR_IMAGE}:${VERSION}"
              "${GHCR_IMAGE}:v${VERSION}"
              "${GHCR_IMAGE}:${MAJOR_MINOR}"
              "${GHCR_IMAGE}:${MAJOR}"
              "${GHCR_IMAGE}:latest"
            )
            if [ "${{ steps.dockerhub.outputs.enabled }}" = "true" ]; then
              TAGS+=(
                "${DH_IMAGE}:${VERSION}"
                "${DH_IMAGE}:v${VERSION}"
                "${DH_IMAGE}:${MAJOR_MINOR}"
                "${DH_IMAGE}:${MAJOR}"
                "${DH_IMAGE}:latest"
              )
            fi
          else
            TAGS=(
              "${GHCR_IMAGE}:edge"
              "${GHCR_IMAGE}:sha-${SHORT_SHA}"
            )
            if [ "${{ steps.dockerhub.outputs.enabled }}" = "true" ]; then
              TAGS+=(
                "${DH_IMAGE}:edge"
                "${DH_IMAGE}:sha-${SHORT_SHA}"
              )
            fi
          fi

          printf -v TAG_ARGS ' --tag %s' "${TAGS[@]}"
          echo "TAG_ARGS=${TAG_ARGS}" >> "$GITHUB_ENV"

      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --build-arg SUPERVISOR_VERSION="${VERSION}" \
            --platform "${PLATFORMS}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --provenance=true \
            --sbom=true \
            ${TAG_ARGS} \
            --push .

      - name: Run arm binaries under QEMU
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/transmission-openvpn:${VERSION}"
          for platform in linux/arm64 linux/arm/v7; do
            docker run --rm --platform "${platform}" "${IMAGE}" version
            docker run --rm --platform "${platform}" "${IMAGE}" list-providers
          done

      - name: Update Docker Hub Description
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ steps.dockerhub.outputs.username }}/transmission-openvpn
