# NordVPN downloads one config at start. There is no ovpn mount and no API token.
# NORDVPN_COUNTRY is an ISO code. NORDVPN_PROTOCOL is udp or tcp. The default is udp.
# NORDVPN_CATEGORY is the servers group, for example legacy_p2p.
# Login is OPENVPN_USERNAME and OPENVPN_PASSWORD from the environment.
# SELFHEAL is unset, so it stays false. It would restart OpenVPN in this process.
# Docker restart: and willfarrell/autoheal are different, and this file enables neither.
# Custom-provider quick start: docker-compose.yml. This file sets no restart policy and leaves SELFHEAL unset.
services:
  transmission-openvpn:
    image: ghcr.io/lostinfuture/transmission-openvpn:edge
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    ports:
      - "9091:9091"
    tmpfs:
      - /run
    volumes:
      - /srv/torrents:/data
      - /srv/transmission-config:/config
    environment:
      OPENVPN_PROVIDER: nordvpn
      NORDVPN_COUNTRY: NL
      NORDVPN_PROTOCOL: udp
      NORDVPN_CATEGORY: legacy_p2p
      OPENVPN_USERNAME: ${OPENVPN_USERNAME}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      LOCAL_NETWORK: 192.168.1.0/24
      PUID: "1000"
      PGID: "1000"
